services:
  guardrail:
    build:
      context: .
      dockerfile: Dockerfile
    image: guardrail:latest
    container_name: guardrail-lab
    ports:
      - "8000:8000"
    environment:
      - PROVIDER=mock
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_PATH=/app/guardrail.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
