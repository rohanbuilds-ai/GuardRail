name: CI / Test Suite & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Static Syntax Verification
        run: |
          uv run python -m compileall src tests

      - name: Lint Verification (Fatal & Syntax Invariants)
        run: |
          uvx ruff check --select E9,F63,F7,F82 src tests

      - name: Run Test Suite
        env:
          PROVIDER: mock
          ENVIRONMENT: testing
        run: |
          uv run pytest -v

  docker-build:
    name: Docker Image Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: guardrail:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Startup & Health
        run: |
          docker run -d --name guardrail-container -p 8000:8000 guardrail:ci-test
          # Wait up to 30s for healthcheck to become healthy or respond
          sleep 5
          for i in {1..6}; do
            STATUS=$(curl -s http://localhost:8000/health | grep "healthy" || true)
            if [ -n "$STATUS" ]; then
              echo "Healthcheck passed: $STATUS"
              break
            fi
            echo "Waiting for container to become healthy (attempt $i)..."
            sleep 5
          done
          # Validate incidents API responds inside container
          curl -f -s http://localhost:8000/api/incidents | grep "INC-001"
          docker stop guardrail-container
